name: Backend Tests

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} + PostgreSQL
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ielts_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ielts_coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ielts_coach
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENV_FILE: .env.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create CI test environment
        working-directory: backend
        shell: bash
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=${DATABASE_URL}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          JWT_ALGORITHM=${JWT_ALGORITHM}
          ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
          REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
          EOF

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify migration head
        working-directory: backend
        run: alembic current
